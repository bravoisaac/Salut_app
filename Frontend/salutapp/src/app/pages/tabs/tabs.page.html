<ion-tabs>
  <ion-tab-bar slot="bottom" aria-label="Navegación principal">
    <div class="tab-brand" aria-hidden="true">
      <span class="tab-brand__mark"><ion-icon name="pulse-outline"></ion-icon></span>
      <span class="tab-brand__copy">
        <strong>Salut</strong>
        <small>Tu red de bienestar</small>
      </span>
    </div>
    <ion-tab-button tab="jobs" routerLink="/app/jobs">
      <ion-icon name="briefcase-outline"></ion-icon>
      <ion-label>Empleos</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="health" routerLink="/app/health">
      <ion-icon name="medkit-outline"></ion-icon>
      <ion-label>Salud</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="my-proposals" routerLink="/app/my-proposals">
      <ion-icon name="mail-unread-outline"></ion-icon>
      <ion-label>Propuestas</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="health-bookings" routerLink="/app/health-bookings">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Reservas</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="chats" routerLink="/app/chats">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <ion-label>Chats</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="profile" routerLink="/app/profile">
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
